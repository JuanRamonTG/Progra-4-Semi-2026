<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Libros y Autores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vue-select@4.0.0-beta.6/dist/vue-select.css">
</head>

<body class="bg-body-tertiary">
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="bi bi-book me-2"></i>GESTIÓN DE LIBROS
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav ms-auto gap-2">
                        <a class="nav-link px-3 rounded-pill" href="#" @click="abrirVentana('autores')">
                            <i class="bi bi-pen-fill me-1"></i> Autores
                        </a>
                        <a class="nav-link px-3 rounded-pill" href="#" @click="abrirVentana('libros')">
                            <i class="bi bi-book me-1"></i> Libros
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container py-4">
            <autores @buscar='buscar("busqueda_autores","obtenerAutores")' @guardar='guardarAutor()' :forms="forms" ref="autores"
                v-show="forms.autores.mostrar"></autores>
            <busqueda_autores @modificar='modificar("autores","modificarAutor", $event)' ref="busqueda_autores"
                v-show="forms.busqueda_autores.mostrar"></busqueda_autores>

            <libros @buscar='buscar("busqueda_libros","obtenerLibros")' @guardar='buscar("busqueda_libros","obtenerLibros")' :forms="forms" ref="libros"
                v-show="forms.libros.mostrar"></libros>
            <busqueda_libros @modificar='modificar("libros","modificarLibro", $event)' ref="busqueda_libros"
                v-show="forms.busqueda_libros.mostrar"></busqueda_libros>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.2.0/dexie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-select@4.0.0-beta.6/dist/vue-select.umd.js"></script>
    <script src="componentes/autores.js"></script>
    <script src="componentes/busqueda_autores.js"></script>
    <script src="componentes/libros.js"></script>
    <script src="componentes/busqueda_libros.js"></script>
    <script src="main.js"></script>
</body>

</html>
